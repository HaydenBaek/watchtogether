<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WatchTogether - Movies</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="top-bar">
    <h1>WatchTogether</h1>
    <div>
      <span id="user-email"></span>
      <button id="logout-button">Logout</button>
    </div>
  </div>

  <div class="box">
    <label for="likes">What do you feel like watching?</label>
    <textarea id="likes" rows="3" maxlength="300"></textarea>
    <label for="avoid">Anything to avoid?</label>
    <textarea id="avoid" rows="2" maxlength="300"></textarea>
    <button id="find-button">Find movies</button>
    <p id="status" class="message"></p>
  </div>

  <p id="genres"></p>
  <div id="movies" class="movies"></div>

  <p id="attribution" class="attribution"></p>

  <script type="module" src="js/user.js"></script>
</body>
</html>
